# 1.7.1, not the latest, and this is a deliberate exception to tracking Conan Center.
# benchmark 1.8 deprecates the const-ref DoNotOptimize overload, and 1.9 also deprecates
# the global Benchmark type. The engine compiles its tests with -Werror and uses both:
# 31 files and roughly 635 call sites would have to change first. 1.7.1 is the newest
# release the engine's own source builds against unchanged, and is what the previous
# package shipped. Moving forward is an engine change, not a packaging one.
version: 1.7.1
rev: 1
targets: [GoogleBenchmark]
platforms: core

# HAVE_BENCHMARK is O3DE's own switch: its test headers compile the benchmark fixtures
# only when it is defined, and the package has always been what defines it. Upstream
# knows nothing about it, so it cannot come from the recipe.
defines: [HAVE_BENCHMARK]
