sources:
  36b80aa:
    url: "https://github.com/GameTechDev/ISPCTextureCompressor/archive/36b80aac50ea401a9adde44d86712c2241b2acfd.tar.gz"
    sha256: "029373e6ec5b10d7e29eefdc5a231fb86c79b76a4a39c58c2727c6729de28ab7"

# The ISPC compiler is a build tool, downloaded per host rather than built. Apple
# Silicon needs a much newer release than the other hosts, which is why the versions
# differ.
ispc:
  Macos:
    armv8:
      url: "https://github.com/ispc/ispc/releases/download/v1.29.1/ispc-v1.29.1-macOS.arm64.tar.gz"
      directory: "osx"
    x86_64:
      url: "https://github.com/ispc/ispc/releases/download/v1.16.1/ispc-v1.16.1-macOS.tar.gz"
      directory: "osx"
  Linux:
    x86_64:
      url: "https://github.com/ispc/ispc/releases/download/v1.16.1/ispc-v1.16.1-linux.tar.gz"
      directory: "linux"
  Windows:
    x86_64:
      url: "https://github.com/ispc/ispc/releases/download/v1.16.1/ispc-v1.16.1-windows.zip"
      directory: "win"

# Two variants: the Apple Silicon one also retargets the ISPC kernels to arm64/neon,
# without which they compile as x86_64 and fail to link.
patches:
  36b80aa:
    default: "patches/ISPCTexComp_36b80aa.patch"
    Macos-armv8: "patches/ISPCTexComp_36b80aa-mac-arm64.patch"
