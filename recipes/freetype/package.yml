version: 2.14.3
rev: 1
targets: [Freetype]
platforms: core
aliases:
  Freetype: [Freetype::Freetype]

# The engine links Freetype on its own, without PNG beside it, so a Freetype that calls
# into libpng cannot be linked at all -- and PNG here is only for colour bitmap glyphs,
# which the engine's font rendering does not use. The previous package was built the
# same way, with no undefined png symbols in it. bzip2 and brotli would need bundling
# and are likewise for font formats nothing asks for. zlib stays: those symbols reach
# Freetype through the rest of the engine, which was true of the previous package too.
options:
  with_png: false
  with_bzip2: false
  with_brotli: false
