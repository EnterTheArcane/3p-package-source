[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "3p-package-source"
version = "1.0.0"
description = "Builds the prebuilt third party packages O3DE downloads at configure time"
requires-python = ">=3.9"
license = "Apache-2.0 OR MIT"

dependencies = [
    "conan==2.31.2",
    "ninja==1.13.0",
]

[tool.setuptools]
packages = []
