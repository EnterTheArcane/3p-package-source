name: Build

on:
  pull_request:
    branches: [main, development]
    paths:
      - recipes/**
      - profiles/**
      - extensions/**
      - tools/**
      - .github/**
      - pyproject.toml
  push:
    branches: [main, development]
    paths:
      - recipes/**
      - profiles/**
      - extensions/**
      - tools/**
      - .github/**
      - pyproject.toml
  workflow_dispatch:
    inputs:
      platform:
        description: Build a single platform (blank builds all)
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Platforms
        id: select
        env:
          ONLY_PLATFORM: ${{ inputs.platform }}
        run: python3 .github/scripts/build_matrix.py >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the toolchain
        run: pip install .

      # The checkout is a Conan local-recipes-index remote. It has first priority, so an
      # O3DE recipe overrides Conan Center while everything else falls through normally.
      - name: Add O3DE Recipe Remote
        run: >-
          conan remote add o3de "$GITHUB_WORKSPACE"
          --type=local-recipes-index --index=0 --force --allowed-packages="*"

      # Qt needs X11 headers and the ARM64 target needs a sysroot. Everything else,
      # including the Android NDK and the Emscripten toolchain, comes from Conan.
      - name: Install Prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
            libxext-dev libxrender-dev libxrandr-dev libxinerama-dev libxi-dev libxkbfile-dev
          if [ "${{ matrix.platform }}" = "linux-arm" ]; then
            sudo apt-get install -y --no-install-recommends crossbuild-essential-arm64
          fi

      - name: Free Disk Space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      # The profile hash is its own key segment so that a profile change cannot be
      # served by restore-keys. Profiles carry [conf] entries, and conf does not take
      # part in a package id, so a cached binary built under the old profile still looks
      # current to --build=missing and would be reused with the change silently missing.
      # Recipe changes are safe to restore from because Conan gives them a new revision.
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ matrix.platform }}-${{ hashFiles('profiles/**') }}-${{ hashFiles('recipes/**', 'extensions/deployers/**') }}
          restore-keys: |
            conan-${{ matrix.platform }}-${{ hashFiles('profiles/**') }}-

      - name: Build Packages
        shell: bash
        run: |
          set -euo pipefail
          references=()
          while IFS= read -r reference; do
            references+=("$reference")
          done < <(conan list '*' -r=o3de --format=compact |
            sed -n 's/^  \([^ ][^ ]*\/[^ ][^ ]*\)$/\1/p')
          if [ ${#references[@]} -eq 0 ]; then
            echo "the o3de remote contains no recipes" >&2
            exit 1
          fi

          for reference in "${references[@]}"; do
            echo "::group::$reference"
            if graph="$(conan graph info --requires="$reference" \
                -pr:h="profiles/${{ matrix.platform }}" \
                -pr:b="profiles/${{ matrix.build_profile }}" \
                --update --filter=binary 2>&1)"; then
              :
            else
              graph_status=$?
              echo "$graph" >&2
              exit "$graph_status"
            fi
            if grep -q 'binary: Invalid' <<< "$graph"; then
              echo "$graph"
              echo "Skipping $reference: invalid for ${{ matrix.platform }}"
              echo "::endgroup::"
              continue
            fi

            conan install --requires="$reference" \
              -pr:h="profiles/${{ matrix.platform }}" \
              -pr:b="profiles/${{ matrix.build_profile }}" \
              --update --build=missing \
              --output-folder="build/${{ matrix.platform }}" \
              --envs-generation=false \
              --deployer="extensions/deployers/engine_package.py" \
              --deployer-folder="packages/${{ matrix.platform }}"
            echo "::endgroup::"
          done

      - name: Validate Packages
        run: python3 tools/validate_package.py packages/${{ matrix.platform }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: packages/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
