name: Promote

# Publishing is deliberately separate from building. Packages are uploaded to the
# development bucket, the engine gets a pull request pinning the new hashes, and only
# then are the same bytes copied to production. Nothing is ever rebuilt on the way.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build workflow run to promote (blank uses the latest on this branch)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - recipes/**
      - profiles/**
      - consumer/**
      - conan.lock

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-development:
    name: Publish Development
    runs-on: ubuntu-24.04
    environment: development
    outputs:
      platforms: ${{ steps.collect.outputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Artifacts come from the build workflow rather than being rebuilt, so what gets
      # published is exactly what was validated.
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Platforms
        id: collect
        run: |
          shopt -s nullglob
          found=()
          for dir in packages/packages-*; do
            [ -f "$dir/packages-manifest.json" ] || continue
            found+=("$(basename "$dir" | sed 's/^packages-//')")
          done
          if [ ${#found[@]} -eq 0 ]; then
            echo "no package artifacts found" >&2
            exit 1
          fi
          printf 'platforms=%s\n' "$(printf '%s\n' "${found[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          printf 'Found %d platform(s): %s\n' "${#found[@]}" "${found[*]}"

      - name: Validate Packages
        run: |
          for dir in packages/packages-*; do
            python3 tools/validate_package.py "$dir"
          done

      - name: Check Published Packages
        env:
          PROD_CDN: ${{ vars.PROD_CDN }}
        run: |
          for dir in packages/packages-*; do
            python3 .github/scripts/check_published.py "$dir"
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_CREDS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CREDS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_CREDS_REGION_NAME }}

      # PackageInfo.json is uploaded last: it is what marks a package as complete, so a
      # failure part way through never leaves a package that looks ready but is not.
      - name: Upload To Development
        run: |
          set -euo pipefail
          bucket="s3://${{ secrets.AWS_PACKAGE_DEV_S3_BUCKET }}"
          for dir in packages/packages-*; do
            for file in "$dir"/*.tar.xz "$dir"/*.tar.xz.SHA256SUMS "$dir"/*.tar.xz.content.SHA256SUMS; do
              [ -e "$file" ] || continue
              aws s3 cp "$file" "$bucket/$(basename "$file")" --acl bucket-owner-full-control
            done
            for file in "$dir"/*.PackageInfo.json; do
              [ -e "$file" ] || continue
              aws s3 cp "$file" "$bucket/$(basename "$file")" --acl bucket-owner-full-control
            done
          done

  update-engine:
    name: Update Engine
    needs: publish-development
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Checkout Engine
        uses: actions/checkout@v4
        with:
          repository: o3de/o3de
          ref: development
          token: ${{ secrets.GHA_TOKEN }}
          path: engine

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id || github.run_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Package Lists
        run: |
          python3 packaging/tools/gen_builtin_packages.py \
            packages/packages-* --engine engine --write

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GHA_TOKEN }}
          path: engine
          branch: third-party/update-packages
          draft: true
          commit-message: Update third party packages
          title: Update third party packages
          body: |
            Generated by the third party package pipeline.

            Packages were built from Conan recipes and published to the development
            bucket. Each `ly_associate_package` entry below pins a package name and the
            hash of the archive that was validated during the build.

            Built from ${{ github.repository }}@${{ github.sha }}.

  publish-production:
    name: Publish Production
    needs: [publish-development, update-engine]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_CREDS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_CREDS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_CREDS_REGION_NAME }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id || github.run_id }}

      # A server side copy of the exact objects that were validated and published to
      # development. Production never sees a separately built artifact.
      - name: Copy To Production
        run: |
          set -euo pipefail
          dev="s3://${{ secrets.AWS_PACKAGE_DEV_S3_BUCKET }}"
          prod="s3://${{ secrets.AWS_PACKAGE_PROD_S3_BUCKET }}"
          for dir in packages/packages-*; do
            for file in "$dir"/*; do
              name="$(basename "$file")"
              case "$name" in
                packages-manifest.json) continue ;;
              esac
              aws s3 cp "$dev/$name" "$prod/$name" --acl bucket-owner-full-control
            done
          done
